USN_kards_game_desc: "\n\n\n\n\n\n\n£GFX_JMNDF_2\n\n\n\n\n\n\n\n\n§Y从陆海空的多线交锋到卡牌组合的千变万化，从历史细节的精准还原到创新机制的深度打磨，《KARDS》早已超越了普通卡牌游戏的范畴。在这里，每一次卡组构筑都是战略思想的凝练，每一场对战都是战术智慧的碰撞。如果你既爱卡牌游戏的烧脑博弈，又怀抱着对二战历史的好奇与敬畏，那么这场跨越时空的指挥之旅，定能让你沉醉其中。不妨现在启动一把kards来为你的国家获得增益吧§!\n\n§Y指挥点数：[?USN_kardsgame_CP]§!\n指挥上限：[?USN_kardsgame_CPC]"