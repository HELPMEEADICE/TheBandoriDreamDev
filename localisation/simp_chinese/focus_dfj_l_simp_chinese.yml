l_simp_chinese:
JDF_Victory_unity: "联合之胜"
JDF_Victory_unity_desc: "在2012年的惨败后，谁也不敢料想非自民党系哪怕拿下2/5的议席的结果，然而，在丰川丑闻中，我们团结了起来，几个思想各异的党奇迹般的团结到了一起，人民联合最终在激烈的此消彼长中奇迹般地赢下了359个席位，现在，正是我们开始大展宏图的时候了。"
JDF_Atonement_for_sins: "清算罪孽"
JDF_Atonement_for_sins_desc: "看看现在的日本吧，破产，失业，财富蒸发，停产，各种恶性社会事件……无不是自民党集团和丰川财团和美国金融资本勾结的结果。这些人打造的政商同盟滋生了无数的腐败，并给我国经济埋下了诸多雷，以至于我们国家如今陷入如此境地。因此，唯有进行全面的清算与追责，我们才能给全体国民一个交代，才能真正让这些人承担应付的责任。"
JDF_Halt_the_nosedive: "中止“跳水”"
JDF_Halt_the_nosedive_desc: "无论是东京证券交易所的各支股票，还是经产省，财务省的报告，数据折线都在奔着向下方向俯冲。当务之急便是想尽一切办法救市和宽松财政，阻止危机继续扩大，只有这样，我们才能避免局势进入到无可挽回的地步。"
JDF_Complete_countermeasures_legislation: "完成对策立法"
JDF_Complete_countermeasures_legislation_desc: "可以说，这次危机暴露出我国政治经济的深刻结构性矛盾，虽然这次事件规模如此庞大有一定的偶然因素，但根本原因还是在于自民党与商人们勾结所带来一系列问题，如果不想办法从源头上解决问题，那么再过几年，这样的事情还会再来一次。因此，我们将进行一次庞大的立法活动，利用我们暂时的席位优势去增设和修改现有的法律，以确保尽可能堵上制度漏洞。"
JDF_Join_the_political_reshuffle: "参与“洗牌”"
JDF_Join_the_political_reshuffle_desc: "在当下，外有美国陷入内战，内有丰川财团暴雷，可以说是巨大的危机了。然而正所谓机遇在危机中，这次突如其来的变故在一瞬间重新打破了日本国内外的格局，给了我们绝佳的机会。然而毕竟事在人为，我们必须积极参与其中，以便在新的起跑线上获得优势。"
JDF_Review_foreign_policy: "重审外交政策"
JDF_Review_foreign_policy_desc: "自二战后，我国的外交政策无论如何改变，大体上还是顺着日美同盟这一构想和和平宪法而展开。然而现如今，美国已然陷入火海，这对于我们来说是一个极为重大的变故。因此，我们的外交政策需要进行激进的转变，甚至是“推倒重来”。"
JDF_clarify_remaining_issues: "清查“遗迹”"
JDF_clarify_remaining_issues_desc: "丰川财团规模庞大，其控制的资产总数长期无法估量，即使在爆雷后，各种明面上的，暗地里藏着的资产和势力也会继续运行并阻挠我们。此外，很多别的大企业也已经盯上了这块肥肉，为了避免产生不必要的腐败和裙带关系，我们需要好好清点一下这个庞然大物所遗留下来的资产。"
JDF_Strengthen_the_CPTPP: "强化CPTPP"
JDF_Strengthen_the_CPTPP_desc: "《跨太平洋伙伴关系全面与进步协定》（CPTPP），是日本一项至关重要的外交成果。\n这份涵盖了环太平洋主要经济体的自由贸易协定，对我国的意义非同凡响。在当前动荡的国际局势下，我们更有必要加倍努力地强化这一合作框架。\n通过深化CPTPP，我们不仅能够团结圈内的重要伙伴，更能借此稳固住我们硕果仅存的对外贸易与经济合作关系。可以说，CPTPP是我们应对全球经济风暴的“压舱石”，也是维系我国在亚太地区影响力的核心支柱。"
JDF_Easing_tensions_with_China: "对华缓和"
JDF_Easing_tensions_with_China_desc: "长期以来，因为各种原因，我们和中国处在一种“政冷经热”的状态之下。但眼下，美国已然崩塌，继续和中国处在这样的状态下可以说是极为有害的。而我们新任政府相对左倾的意识形态也减少了一部分的包袱。既然如此，不如让我们和这个最大的贸易伙伴缓和一下关系，纵然有人会批评我们是引狼入室，但恐怕直接的对抗会让我们更加有害。"
JDF_Take_over_the_USA: "替代美国角色"
JDF_Take_over_the_USA_desc: "不论我们想不想，能不能，我们都必须承认，日本是美国崩塌后亚太最大的自由民主国家。在这个时候，为了我们的国际信誉和亚太局势的稳定，我们都必须替代美国原有在亚太的角色，维系自由世界的和平稳定。"
JDF_Finalize_trade_agreement: "谈拢自贸协议"
JDF_Finalize_trade_agreement_desc: "很多人都听过曾经亚太的一个重要构想——中日韩自贸区。然而因为各种原因，这份构想始终未能落实，而中国和韩国在制造产业上的崛起也使得三国的产业竞争愈发激烈，这份协定的落地就更无从谈起了。然而现在美国已然崩塌，在当下这个全世界经济都在暴雷的前提下，恐怕我们也只能接受一些浮士德式的交易了。"
JDF_Promote_structural_reform: "推动构造改革"
JDF_Promote_structural_reform_desc: "在过去的数十年时间里，日本用过各种方法刺激经济增长，但都收效甚微，而其中重要的一个原因是彻底的结构性改革的缺失。僵化，论资排辈，政商勾结……许多不合理的制度仍存并助推这些因素恶化。但现在，外部的变动给了我们机会，一项改变旧有体系的“大清算“已然势在必得。"
JDF_Reform_economic_organizations: "改革经济团体"
JDF_Reform_economic_organizations_desc: "经团联，商工会议所，经济同友会……这些你耳熟能详的名字全是日本最重要的经济团体。自泡沫破灭以来，这些经济团体就成为了官商勾结的温床和低效，封闭的症结所在。因此，一场深刻的经济改革将就此启动，让这些团体能够真正适应于一个现代化的日本经济。"
JDF_Deepen_Japan-EU_cooperation: "深化日欧合作"
JDF_Deepen_Japan-EU_cooperation_desc: "当下，在美国崩塌的废墟上，日本或许只剩下一个实力雄厚且价值观相近的朋友——欧盟。在美国崩塌之时，欧盟也和我们一样面临着巨大的国内外危机。正是在这样危险的时刻，我们就越是需要抱团在一起，强化我们之间的纽带。"
JDF_Explore_paths_nationalization: "思考国有化路径"
JDF_Explore_paths_nationalization_desc: "于世界上所有的进步政权而言，§R国有化§!，或对关键性产业进行更强的公共干预，都是一个典型的政策选项。丰川财团那骇人听闻的丑闻，已经淋漓尽致地向我们展示了——§R一个体量过于庞大、权力不受约束的私有企业联合体，其最终的暴走将会带来何等灾难性的后果。§!\n因此，我们有必要将丰川财团旧有的核心业务，特别是那些涉及国计民生的领域，进行§R审慎而坚决的国有化或公私合营改造。§!这不仅是为了清算旧时代的遗毒，更是为了以此为契机，建立起一套全新的、能够有效监督和制衡大型资本的制度框架，从根本上避免任何企业，重蹈丰川财团的覆辙。"
JDF_Advance_the_agenda: "推动议程"
JDF_Advance_the_agenda_desc: "终于，我们可以腾出手来进行别的工作了。长久以来，我们都有一系列的改造国家的议程，只是苦于自民党的长期独大而无法施行。而现在，我们的机会终于轮到了。"
JDF_Advance_reform_separate_surnames: "推动别姓改革"
JDF_Advance_reform_separate_surnames_desc: "作为发达国家，日本有一个一直在国际上影响我们形象的制度——夫妇同姓制度。这个制度让我们国家在妇女权益问题上显得尤为落后。在过去，保守派百般抵制，总务省的官员们以技术为由敷衍，因而任何改革都只能是纸上谈兵。但如今，我们已经把握了政权，改革也自然要水到渠成了。"
JDF_Advance_green_economy: "推进绿色经济"
JDF_Advance_green_economy_desc: "在当下，全球都在推进减少碳排放的议程，而在福岛核电事故后，我国民众对于核电废止的诉求也在走高。然而由于自民党的立场和现实运作成本的考量，我国在推进绿电的进程不尽如人意。现在，虽然立刻推行“零核电”政策还是过于激进，但加速淘汰火电核电已经刻不容缓。"
JDF_Enhance_APAC_cooperation: "强化亚太合作"
JDF_Enhance_APAC_cooperation_desc: "美国内战的多米诺效应已经显现，失去了这个超级大国的世界已然开始秩序崩塌，而这对我们极为不利，因此，我们有必要和亚太国家加强合作，共度难关，并尽可能确保各国秩序和往来的稳定。"
JDF_Strengthen_human_investment: "人本投资强化"
JDF_Strengthen_human_investment_desc: "世界上最重要的是什么东西？是人，是每个活生生的国民。回看那些困扰我们多年的问题：老龄化，少子化，男女不平等……这些都是人的问题。我们要做的，就是要投资我们的上一代，让他们得以安心度过日子；投资我们的下一代，让这个国家的未来明朗起来。"
JDF_comprehensive_equality: "迈向全面平权"
JDF_comprehensive_equality_desc: "可以说，日本在全球先进国家里是平权做的相当差的一批。男女权益差劲已经是老生常谈了，而所谓的多元性别平权也一直走的很慢。不过现在，我们可以在这上面向前推进一大步，让日本走在平权的前列。"
JDF_Cut_consumption_tax: "削减消费税"
JDF_Cut_consumption_tax_desc: "消费税，这个可恶的税种，从诞生之际就一直给我们的普通国民施加了严重的负担。而安倍时期这项税还在不断走高。此外，我们也早就承诺过要削减这个税。既然如此，现在就然我们下调这个税，为我们的国民减轻负担吧。"
JDF_Maintain_fiscal_discipline: "保持财政纪律"
JDF_Maintain_fiscal_discipline_desc: "我们痛斥消费税的罪恶，理解国民的痛苦，但我们也得看到日本天文数字般的国债和不断走高的社会支出，继续扩大财政赤字只能是饮鸩止渴。所以，为了防止这次的危机直接击垮日本的信用评级和财政稳健，我们只能暂时开源节流，隐忍一时。"
JDF_Uphold_constitutionalist: "维系护宪立场"
JDF_Uphold_constitutionalist_desc: "日本战后吸取教训的最大成果是什么？正是那部和平宪法。现在，有人以所谓世界局势变化为由要求松动甚至废除此法。但回顾旧日本的历史，不正是在一次次的所谓世界局势中变化而扩军，最终走上军国主义道路的吗？更何况我们是持有护宪立场的党，无论怎么说，我们不会去松动这个国家的根本精神所在。"
JDF_Assess_the_situation: "审时度势"
JDF_Assess_the_situation_desc: "在敌人扩大自己实力的时候选择软弱不是一个好的想法。纵然我们联盟内的护宪派不在少数，但在日本和中国扩大武备的当下，我们有必要给自己松松绑，避免火烧到我们头上时没有任何准备。"
JDF_Withdrawal_the_Party: "维新会脱离"
JDF_Withdrawal_the_Party_desc: "那群该死的维新会！他们竟然选择在这种时候脱离我们。虽然我们早有预料，但这样一来，我们在众议院的席位就将失去2/3多数，事实上意味着我们的政府在许多事情上面临停摆的风险，现如今，我们只能走一步是一步。"
JDF_Kasumigaseki_personnel: "霞关洗牌"
JDF_Kasumigaseki_personnel_desc: "尽管我们批评安倍利用人事局滥权，但在他手上是一回事，在我们手上就是另一回事了。为了避免我们之前的政策不能落实，我们有必要让一些和我们不太对付的人下去，换上一些相对可以接受的人，以避免霞关先把我们架空了。"
JDF_Strengthen_power_labor: "强化工会势力"
JDF_Strengthen_power_labor_desc: "我们的票仓一直是各种工会，可惜自国铁改革时代以来，日本的工会就在衰微，右转，而长期以来的企业工会状况更是加剧了这个问题。现在，我们有必要出台一些措施来强化他，为了我们执政的稳固，也为了接下来的参院选。"
JDF_Expose_the_misdeeds: "宣扬自民恶行"
JDF_Expose_the_misdeeds_desc: "尽看看自民党吧，正是这群恬不知耻的人的存在，日本才会诞生那么多官商勾结的事，并且搞出那么大的烂摊子。我们有必要把这个党的丑恶历史全部扒一遍，让全体国民看清他们的丑恶嘴脸，然后把他们扫进历史的垃圾堆里。"
JDF_Instigate_Komeito_Party: "策反公明党"
JDF_Instigate_Komeito_Party_desc: "自民和公明的合作持续了多年，两者互相帮助一定程度上成就了后小泉时代自民得以维系优势的关键。然而，现在的自民党形象早已崩塌，对于公明党来说已经可以视作负资产，因此，我们可以尝试策反他们，这样可以给自民致命一击，并且削弱维新会脱离带来的影响。"
JDF_Fall_short_of_expectations: "不尽人意"
JDF_Fall_short_of_expectations_desc: "我们失败了……尽管有着丑闻的自民党陷入了惨败，然而，我们也没有好到哪里去，各种磨合，内斗让不少选民也丧失了对我们的信心，而维新会却大获全胜，我们的联盟依然无法拿下参院过半，最凶险的时刻来了"
JDF_Combat_right_groups: "打击右翼团体"
JDF_Combat_right_groups_desc: "最近的改革和对外政策无疑激怒了右翼，他们的宣讲车在城市到处都是，而各种抗议活动更是频频出现，他们想毁掉这些成果，我们绝不能容许。加大力度打击右翼的活动，限制他们的出动，发动宣传战，我们将利用一切可以对抗右翼的措施。\n\n然而，内部有人警告我们已经走得太远，人民联合左倾得太过严重，已经有党派吵着要退出了，许多党员也表现出不满......但是现在已无路可退，唯有前进。"
JDF_Stage_left_march: "组织左翼游行"
JDF_Stage_left_march_desc: "在选战和治理上我们确实受挫了，然而，我们还可以组织我们的支持者上街游行。我们之前的政策吸引了不少立场偏左的年轻选民，我们应该将他们组织起来，在街头给那些右翼看看我们的力量。"
JDF_Development_Plan_Northeast: "东北建设方案"
JDF_Development_Plan_Northeast_desc: "东北地区和北海道长期以来是我们日本左翼的票仓，自然作为回报，我们将推行一份建设计划，在这些地方建设基础设施和工厂，回应他们对我们的支持，也保全我们的核心力量"
JDF_Promote_education_reform: "推动教育改革"
JDF_Promote_education_reform_desc: "想要让右翼在未来的我国无容身之地，根本方法就是从教育入手。孩子们是未来，只有在教科书中教授了他们正确的内容，社会上才能形成反思我国过去战争罪行，反对战争的思潮，未来的日本才能不受极右翼和军国主义思想荼毒。我们将启动教育改革，特别是在历史教育方面。"
JDF_chongshen_lichang: "重申立场"
JDF_chongshen_lichang_desc: "东亚不再和平，中国已经对台湾政权发动进攻，誓言统一祖国。不论极右翼如何煽动和鼓吹，都绝不能遂了他们的愿，将日本人民拖进一场血腥的战争中。我们将重申立场，奉行武装中立政策，不干涉这场战争，不支援任何一方。日本将永远和平！"