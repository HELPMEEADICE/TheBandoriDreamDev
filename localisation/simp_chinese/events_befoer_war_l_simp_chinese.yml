l_simp_chinese:
bangjap.1.t: "风起之日"
bangjap.1.d: "十月的风已经带上了些许凉意，吹过光秃秃的行道树，卷起几片枯叶。市谷有咲拉了拉自己的外套领口，快步走进了作为临时投票站的小学体育馆。\n体育馆里异常安静，只听得见工作人员低声的引导和选民们细碎的脚步声。空气中飘着一丝消毒水的味道，混杂着某种难以言状的紧张与期待。队伍缓慢地前进着，有咲看着前面排队的老人，看着他们脸上那混杂着习惯与茫然的神情，思绪不由得飘远了。\n电视里的新闻播了几个月了。经济衰退，失业率攀升，街上的店铺一家接一家地关门。连沙绫家那总是充满活力的山吹面包店，最近也开始为了成本问题而发愁。曾经理所当然的日常，仿佛正在一点点被侵蚀、崩坏。而执政了不知多少年的那个大党，除了在电视上鞠躬道歉、说着些不痛不痒的官话，似乎什么也改变不了。\n“真是的，一群只会动嘴皮子的老头子……” 有咲在心里小声嘀咕。\n她想起了香澄。那个无可救药的笨蛋，即便在这样的气氛下，也依然抱着吉他，满眼放光地嚷嚷着“要用音乐的力量让大家露出笑容”“要找到那种kirakira、dokidoki的感觉”。\n在以前，有咲只会觉得那是天真得可笑的傻话。但现在，她却觉得，能让香澄继续说这种傻话的世界，本身就是一种需要被守护的珍贵之物。\n如果人们每天都只为了生计而奔波，被生活的重压喘不过气，谁还会有心情去Live House听歌？谁还会有余力去感受音乐带来的悸动？当整个社会都失去了活力，POPIPA的“闪耀”又要照亮给谁看？\n她不想看到那样的未来。\n“下一位，请。” 工作人员的声音把她拉回现实。\n有咲走进狭小的投票隔间，拿起那支系着绳子的铅笔。白色的选票摊在眼前，分成了小党派选举和比例代表选举两部分。她没有丝毫犹豫，在比例代表的选票上，一笔一划地写下了“立憲民主党”五个字。\n笔尖划过纸张，发出轻微的沙沙声。\n她不知道这个选择是否正确。立民的口号喊得天花乱坠，承诺着变革与新生，听起来也和香澄的梦想一样，美好得有些不切实际。\n但是，总比什么都不做好。\n总要有人，为那个笨蛋可以继续放声歌唱的未来，投下这一票。\n将选票对折，投入票箱。那是一个轻飘飘的、几乎没有重量的动作，却仿佛承载了千钧的愿望。\n走出体育馆，午后的阳光有些刺眼。有咲拿出手机，一条新消息正躺在屏幕上。\n【有咲——！投完票了吗？我突然有了超棒的灵感！我们去CiRCLE练习吧！现在！立刻！马上！☆】\n有咲的嘴角不自觉地微微上扬，但很快又被她用一声夸张的叹息压了下去。手指飞快地在屏幕上敲击着。\n【哈？你以为我像你一样闲吗？课题还没做完啊！……算了，半小时后到。你要是敢迟到就死定了！】\n她收起手机，加快了脚步。风从耳边吹过，似乎也没有那么冷了。不管这个国家未来会怎样，至少今天下午，她们的音乐还会继续响彻在那个小小的地下室里。\n对有咲而言，这就足够了。"
bangjap.1.a: "改变"

bangjap.2.t: "最好的特效药"
bangjap.2.d: "爱音难受极了。\n或许是她向来喜欢外出凑热闹的性格使然，前两天东京一宣布放松管控，她便迫不及待地冲了出去。然而，东京人口众多，鱼龙混杂，她也不知道自己究竟是在哪个环节，染上了这该死的病毒。现在，她只能头昏脑胀地蜷缩在床上，连动一根手指的力气都没有。\nMyGO!!!!!的大家呢……爱音在迷迷糊糊中，多么希望同伴们此刻就在身边。但这个念头很快又被她自己打消了。平时大家尚且不会随便登门拜访，更何况是现在自己这副病怏怏的样子？万一……万一因为自己，让大家都遭殃了可怎么办？\n唉，头好疼……爱音这么想着，意识又沉入了昏睡的深渊。\n就在这半梦半醒之间，爱音突然感觉到，好像有人轻轻地走进了房间。\n一声熟悉的、带着一丝怯懦的“小爱”，温柔地传到了她的耳中。\n是小灯！\n爱音猛地坐起身，果然看到了灯那一脸焦急的模样。她的身边，还站着略带愁容的爽世，表面冷静但眼神中暗藏关切的立希，以及那个永远一副慵懒状态的“野猫”乐奈。\n“哇，太好了，大家都在！” 爱音惊喜地叫出声。但话音刚落，一阵剧烈的晕眩感袭来，她才意识到，刚才那不过是一场过于真实的梦。\n“唉，连梦和现实都分不清了吗……” 爱音沮丧地自言自语，重新倒回了床上。但就在这时，她突然感觉不太对劲。\n她缓缓地转过头，难以置信地睁大了眼睛。\n四个人，就静静地站在她的床边。和梦里唯一的区别是，她们每个人的脸上，都严严实实地戴着口罩。\n“咳……你们……怎么都来了？” 爱音惊讶地问着，声音因生病而沙哑，却掩不住那一丝雀跃的喜悦。\n“小爱，听说你病了，我们……就约好了一起来看你。” 灯还是第一个开了口。她本就内向，隔着口罩，说话的声音更小了，但每一个字，爱音都听得清清楚楚，“你……没事吧？”\n“我、我可没说过不来看你！” 爽世别过头去，说出了一句非常标准的、此地无银三百两式的发言。\n“唔……那个，爱音，这两天……还好吗？” 立希显得有些笨拙。她确实不擅长说这种关心人的话，尤其是对平日里还时常被她批评的爱音。\n“无趣的病毒。” 乐奈言简意赅，一如既往。\n看着眼前这些虽然言辞各异，却都用自己的方式表达着关心的同伴们，爱音突然感觉，身体的沉重和心里的阴霾，都一扫而空了。那份温暖的感觉，比任何药物都更有效。\n她笑了，发自内心地笑了。\n“也许……这就是MyGO!!!!!的‘羁绊’吧。” 她在心里想。"
bangjap.2.a: "迷茫，但不再是孤身一人。"

bangjap.3.t: "至少，此刻"
bangjap.3.d: "“嗯，那么就有劳你了，凑同学。”\n“好的，宇田川同学，振作一些。这并不是什么无法挽回的大事。”\n放下电话，冰川纱夜不禁感到一阵混杂着担忧的感慨。这场突如其来的病毒，不仅中断了所有乐队的活动，更击倒了一些重要的同伴。她实在有些担心，那两位责任心虽强却未必足够细心的同伴，能否真的照顾好她们那位被病毒影响的友人。\n纱夜这么想着，戴好口罩，轻轻推开了旁边卧室的门。\n“嗯……姐姐，你来啦？” 房间里的人开了口。那个平时总是开朗到有些孩子气、充满“るんっ♪”感的声音，此刻也不免变得沙哑而虚弱，“这一点也不‘るん’……我……我想吃薯条……”\n“胡说什么呢，日菜。你现在可是病人，不能吃薯条那种东西。” 纱夜嘴上这么责备着，可她的内心里，显然有另一个声音在轻声抗议：她都已经难受成这样了，你就不能顺着她，任性这么一下吗？\n病床上的人缓缓转过身来。即使她再怎么努力地想要像平日里那样露出笑容，那种因病痛带来的虚弱与难受，依然溢于言表。纱夜看着，心里顿时感到一阵揪紧的难受。她回想起自己过去生病时，日菜也是这样守在床边，笑着看她。那时，她还曾嘴硬地说日菜“从表情上完全看不出来在担心我”。但现如今，纱-夜多么希望，自己也能在这里，哪怕只是挤出一些假惺惺的笑容来，好让妹妹安心一些。\n这么多年来，姐妹俩之间曾有过许多误会与心结，和解的过程也充满了曲折。但在此刻，望着那个无力地躺在病床上、连说话都有些费劲的人，纱夜宁愿，现在在她面前的，是从前那个精力旺盛、甚至有些烦人的日菜。\n望着日菜，纱夜的思绪又不禁飘远。那个总是如同母亲一般，细心照顾着大家的今井同学，如今是不是也要由别人来照顾她了呢？还有那个总是那么内向羞涩的白金同学，在她需要帮助的时候，真的会主动向大家开口求助吗？还有……还有那些更多、更多的人。\n纱夜是法学生，她的思绪不免继续发散开去。在这场席卷全球的灾难中，究竟有多少人，因为这无情的病毒而提前离去了生命？又有多少人，因为这漫长的封锁而被孤独与焦虑所折磨？\n在这个本应万物复苏的春天里，大家，却仿佛都病了。\n纱夜用力地摇了摇头，将纷乱的思绪拉回现实。她重新将目光聚焦在病床上的妹妹身上，然后，她伸出了自己的手，轻轻地、却又坚定地，握住了那只因发烧而滚烫的手，久久没有松开。\n“唔……姐姐？”\n——日菜，至少现在，我还能在这里，亲手照顾你。"
bangjap.3.a: "这样，也就足够了。"
