l_simp_chinese:
bangjap.1.t: "风起之日"
bangjap.1.d: "十月的风已经带上了些许凉意，吹过光秃秃的行道树，卷起几片枯叶。市谷有咲拉了拉自己的外套领口，快步走进了作为临时投票站的小学体育馆。\n体育馆里异常安静，只听得见工作人员低声的引导和选民们细碎的脚步声。空气中飘着一丝消毒水的味道，混杂着某种难以言状的紧张与期待。队伍缓慢地前进着，有咲看着前面排队的老人，看着他们脸上那混杂着习惯与茫然的神情，思绪不由得飘远了。\n电视里的新闻播了几个月了。经济衰退，失业率攀升，街上的店铺一家接一家地关门。连沙绫家那总是充满活力的山吹面包店，最近也开始为了成本问题而发愁。曾经理所当然的日常，仿佛正在一点点被侵蚀、崩坏。而执政了不知多少年的那个大党，除了在电视上鞠躬道歉、说着些不痛不痒的官话，似乎什么也改变不了。\n“真是的，一群只会动嘴皮子的老头子……” 有咲在心里小声嘀咕。\n她想起了香澄。那个无可救药的笨蛋，即便在这样的气氛下，也依然抱着吉他，满眼放光地嚷嚷着“要用音乐的力量让大家露出笑容”“要找到那种kirakira、dokidoki的感觉”。\n在以前，有咲只会觉得那是天真得可笑的傻话。但现在，她却觉得，能让香澄继续说这种傻话的世界，本身就是一种需要被守护的珍贵之物。\n如果人们每天都只为了生计而奔波，被生活的重压喘不过气，谁还会有心情去Live House听歌？谁还会有余力去感受音乐带来的悸动？当整个社会都失去了活力，POPIPA的“闪耀”又要照亮给谁看？\n她不想看到那样的未来。\n“下一位，请。” 工作人员的声音把她拉回现实。\n有咲走进狭小的投票隔间，拿起那支系着绳子的铅笔。白色的选票摊在眼前，分成了小党派选举和比例代表选举两部分。她没有丝毫犹豫，在比例代表的选票上，一笔一划地写下了“立憲民主党”五个字。\n笔尖划过纸张，发出轻微的沙沙声。\n她不知道这个选择是否正确。立民的口号喊得天花乱坠，承诺着变革与新生，听起来也和香澄的梦想一样，美好得有些不切实际。\n但是，总比什么都不做好。\n总要有人，为那个笨蛋可以继续放声歌唱的未来，投下这一票。\n将选票对折，投入票箱。那是一个轻飘飘的、几乎没有重量的动作，却仿佛承载了千钧的愿望。\n走出体育馆，午后的阳光有些刺眼。有咲拿出手机，一条新消息正躺在屏幕上。\n【有咲——！投完票了吗？我突然有了超棒的灵感！我们去CiRCLE练习吧！现在！立刻！马上！☆】\n有咲的嘴角不自觉地微微上扬，但很快又被她用一声夸张的叹息压了下去。手指飞快地在屏幕上敲击着。\n【哈？你以为我像你一样闲吗？课题还没做完啊！……算了，半小时后到。你要是敢迟到就死定了！】\n她收起手机，加快了脚步。风从耳边吹过，似乎也没有那么冷了。不管这个国家未来会怎样，至少今天下午，她们的音乐还会继续响彻在那个小小的地下室里。\n对有咲而言，这就足够了。"
bangjap.1.a: "改变"

bangjap.2.t: "最好的特效药"
bangjap.2.d: "爱音难受极了。\n或许是她向来喜欢外出凑热闹的性格使然，前两天东京一宣布放松管控，她便迫不及待地冲了出去。然而，东京人口众多，鱼龙混杂，她也不知道自己究竟是在哪个环节，染上了这该死的病毒。现在，她只能头昏脑胀地蜷缩在床上，连动一根手指的力气都没有。\nMyGO!!!!!的大家呢……爱音在迷迷糊糊中，多么希望同伴们此刻就在身边。但这个念头很快又被她自己打消了。平时大家尚且不会随便登门拜访，更何况是现在自己这副病怏怏的样子？万一……万一因为自己，让大家都遭殃了可怎么办？\n唉，头好疼……爱音这么想着，意识又沉入了昏睡的深渊。\n就在这半梦半醒之间，爱音突然感觉到，好像有人轻轻地走进了房间。\n一声熟悉的、带着一丝怯懦的“小爱”，温柔地传到了她的耳中。\n是小灯！\n爱音猛地坐起身，果然看到了灯那一脸焦急的模样。她的身边，还站着略带愁容的爽世，表面冷静但眼神中暗藏关切的立希，以及那个永远一副慵懒状态的“野猫”乐奈。\n“哇，太好了，大家都在！” 爱音惊喜地叫出声。但话音刚落，一阵剧烈的晕眩感袭来，她才意识到，刚才那不过是一场过于真实的梦。\n“唉，连梦和现实都分不清了吗……” 爱音沮丧地自言自语，重新倒回了床上。但就在这时，她突然感觉不太对劲。\n她缓缓地转过头，难以置信地睁大了眼睛。\n四个人，就静静地站在她的床边。和梦里唯一的区别是，她们每个人的脸上，都严严实实地戴着口罩。\n“咳……你们……怎么都来了？” 爱音惊讶地问着，声音因生病而沙哑，却掩不住那一丝雀跃的喜悦。\n“小爱，听说你病了，我们……就约好了一起来看你。” 灯还是第一个开了口。她本就内向，隔着口罩，说话的声音更小了，但每一个字，爱音都听得清清楚楚，“你……没事吧？”\n“我、我可没说过不来看你！” 爽世别过头去，说出了一句非常标准的、此地无银三百两式的发言。\n“唔……那个，爱音，这两天……还好吗？” 立希显得有些笨拙。她确实不擅长说这种关心人的话，尤其是对平日里还时常被她批评的爱音。\n“无趣的病毒。” 乐奈言简意赅，一如既往。\n看着眼前这些虽然言辞各异，却都用自己的方式表达着关心的同伴们，爱音突然感觉，身体的沉重和心里的阴霾，都一扫而空了。那份温暖的感觉，比任何药物都更有效。\n她笑了，发自内心地笑了。\n“也许……这就是MyGO!!!!!的‘羁绊’吧。” 她在心里想。"
bangjap.2.a: "迷茫，但不再是孤身一人。"

bangjap.3.t: "至少，此刻"
bangjap.3.d: "“嗯，那么就有劳你了，凑同学。”\n“好的，宇田川同学，振作一些。这并不是什么无法挽回的大事。”\n放下电话，冰川纱夜不禁感到一阵混杂着担忧的感慨。这场突如其来的病毒，不仅中断了所有乐队的活动，更击倒了一些重要的同伴。她实在有些担心，那两位责任心虽强却未必足够细心的同伴，能否真的照顾好她们那位被病毒影响的友人。\n纱夜这么想着，戴好口罩，轻轻推开了旁边卧室的门。\n“嗯……姐姐，你来啦？” 房间里的人开了口。那个平时总是开朗到有些孩子气、充满“るんっ♪”感的声音，此刻也不免变得沙哑而虚弱，“这一点也不‘るん’……我……我想吃薯条……”\n“胡说什么呢，日菜。你现在可是病人，不能吃薯条那种东西。” 纱夜嘴上这么责备着，可她的内心里，显然有另一个声音在轻声抗议：她都已经难受成这样了，你就不能顺着她，任性这么一下吗？\n病床上的人缓缓转过身来。即使她再怎么努力地想要像平日里那样露出笑容，那种因病痛带来的虚弱与难受，依然溢于言表。纱夜看着，心里顿时感到一阵揪紧的难受。她回想起自己过去生病时，日菜也是这样守在床边，笑着看她。那时，她还曾嘴硬地说日菜“从表情上完全看不出来在担心我”。但现如今，纱-夜多么希望，自己也能在这里，哪怕只是挤出一些假惺惺的笑容来，好让妹妹安心一些。\n这么多年来，姐妹俩之间曾有过许多误会与心结，和解的过程也充满了曲折。但在此刻，望着那个无力地躺在病床上、连说话都有些费劲的人，纱夜宁愿，现在在她面前的，是从前那个精力旺盛、甚至有些烦人的日菜。\n望着日菜，纱夜的思绪又不禁飘远。那个总是如同母亲一般，细心照顾着大家的今井同学，如今是不是也要由别人来照顾她了呢？还有那个总是那么内向羞涩的白金同学，在她需要帮助的时候，真的会主动向大家开口求助吗？还有……还有那些更多、更多的人。\n纱夜是法学生，她的思绪不免继续发散开去。在这场席卷全球的灾难中，究竟有多少人，因为这无情的病毒而提前离去了生命？又有多少人，因为这漫长的封锁而被孤独与焦虑所折磨？\n在这个本应万物复苏的春天里，大家，却仿佛都病了。\n纱夜用力地摇了摇头，将纷乱的思绪拉回现实。她重新将目光聚焦在病床上的妹妹身上，然后，她伸出了自己的手，轻轻地、却又坚定地，握住了那只因发烧而滚烫的手，久久没有松开。\n“唔……姐姐？”\n——日菜，至少现在，我还能在这里，亲手照顾你。"
bangjap.3.a: "这样，也就足够了。"

bangjap.2001.t: "刀刺在背"
bangjap.2001.d: "在日本西部的重镇大阪，夜色之下的道顿堀依旧灯红酒绿。东京的政治危机与刀光剑影，似乎丝毫未能触及这座城市的喧嚣与繁华。然而，这种表面的平静，终究只是一种假象——正如这座城市暗流汹涌的政坛一样。\n\n在一家门面低调的高级料亭深处，聚集着几位足以左右关西乃至全国政局的人物——日本维新会代表松井一郎，干事长马场伸幸，政调会长浅田均，总务会长东彻，以及，这座城市名义上与事实上的“王”，大阪府知事吉村洋文。\n\n包间内的灯光很暗，只听得见品尝精致食物与啜饮高级清酒的声音。偶尔响起几句交谈，也只是些无关紧-要的家常闲话。这看起来，似乎只是一次大佬们放松身心的休闲聚餐罢了。\n\n酒过三巡，马场伸幸首先放下了筷子，打破了这刻意的平静：“那么，事情就这么定了？”\n\n“没办法。他们……已经走得太远了。” 浅田均夹起一块晶莹剔透的金枪鱼大腹，缓缓送入口中，语气像是惋惜，又像是下了决心。\n\n“恐怕再这样下去，我们就要惹怒自己的基本盘了。” 吉村洋文放下了手中的酒杯，杯底与桌面接触，发出沉闷的一声轻响，“反正，现在大家都陷入了信任危机。对我们来说，倒是有的是机会独善其身。”\n\n接着，又是一阵沉默。众人仿佛都在回味着这句话，又开始默默地吃喝起来。\n\n最终，松井一郎举起了酒杯。在昏暗的光线下，他的半张脸都隐在阴影之中，让人看不清表情。\n\n“那么，就这样吧。” 他的声音平静而有力。\n\n“敬……这个夜晚。”\n\n第二天的午休时间，一个名叫平野明的普通公司职员，在便利店买了一份猪排饭和一份报纸。当他一边咀嚼着猪排，一边随意地扫向报纸头版时，一段黑色的标题，差点让他当场被嘴里的饭噎住。\n\n“速报：日本维新会代表松井一郎宣布，辞去财务大臣一职。同时，维新会正式宣布，退出联合政府。”"
bangjap.2001.a: "又是一场小泽一郎和野田佳彦的旧戏重演？"

bgd.2002.t: "枝野改善对华关系"
bgd.2002.d: "森健良坐在外务省事务次官那间能俯瞰霞关景色的办公室里，正埋首于一堆似乎永远处理不完的文件中。自从美国崩溃以来，整个外务省就陷入了一种“全年无休”的疯狂运转状态。而枝野内阁上台后，更是如此——新首相一会儿提出要“对华缓和”，一会儿又要“强化CPTPP”，同时还要加大与俄罗斯和欧盟的接触力度。不过老实说，对于这些看似激进的转向，森健良倒是完全可以理解。在当前这种全球性的惊涛骇浪之中，任何一个不想让日本这艘船直接被风暴击垮的舵手，都会做出同样的选择。\n\n但今天的森健良，心里依旧有些忐忑。这是因为，枝野首相本人来了。此刻，他正和新上任的外务相玉木雄一郎，就在隔壁的大臣办公室里。透过厚重的门板，森健良隐隐约约地听到了一些对话的片段。\n\n“……首相阁下，您真的要这么做吗？我必须说，这其中依然存在着巨大的政治风险……” 这是玉木外相的声音，虽然看不到他的表情，但森健良还是能从那压低的语调中，感受到一丝不安。\n\n“是啊……风险很大。但是玉木君，我们已经别无他法了……” 这是枝野首相的回应，声音里带着一种无可奈何的决然。\n\n就在森健良开始有些胡思乱想的时候，他办公室的门被敲响了。“请进。” 他说。 玉木外相和枝野首相一前一后地走了进来。在几句简短的寒暄之后，枝野首相直接切入了正题：“森次官，能不能麻烦您，帮我接通一下……到北京的电话。”\n\n森健良听到这句话，眼神瞬间发生了微妙的变化，但他很快便恢复了一位资深外交官应有的镇定。“当然可以，首相先生。请您稍等片刻。” 他拿起桌上那部红色的保密电话，先是用清晰简练的日语下达了几道指令，随后又用流利的中文与电话那头进行了几句寒暄确认。\n\n片刻之后，他将话筒递给了枝野首相。\n\n枝野接了过来，听筒里传来一个略显苍老，但对他来说也相当熟悉的声音：“首相先生，近来可还安好？”\n\n“我很好，外长先生，谢谢您。” 枝野的语气平静而郑重，“我希望，很快，中日之间可以实现更高层级的交往。然后……”\n\n他顿了顿，仿佛在为接下来的话语积蓄力量。 “……共同签署一份指导未来关系的新合作协议。”"
bgd.2002.a: "合作共赢"

bangjap.2003.t: "决断"
bangjap.2003.d: "菅义伟瘫坐在总理大臣的座椅上，感觉全身的力气都被抽空了。桌上那份晨报，他一眼未看，却早已知道上面的内容。那刺眼的黑体标题如同催命符一般——\n“丰川集团总裁丰川定治、前经产大臣世耕弘成，被东京地检特搜部正式起诉。”\n他盯着那行字，指尖微微颤抖。那两个名字，他再熟悉不过。尤其是后者——安倍派的核心、党内的绝对重臣。\n他当然清楚自己当初为何能接替安倍出任总裁。说到底，他不过是被推上前台的“裱糊匠”，专为前任擦屁股的人罢了。自民党这棵百年老树，早就被金权与派系的藤蔓缠得腐烂不堪——可他没想到，腐烂的程度竟已到了这种地步。\n据报道，世耕在认罪供述中交代出一连串政商勾结名单，从地方议员到中央大臣，牵扯之广，几乎覆盖了整个党内半数派阀。更离谱的是，丰川集团竟通过空壳公司吞下北海道振兴项目，从港口到能源，甚至包括国家级工程“北海道新干线”！那可是写进国策的项目啊。\n更让他血压飙升的，是公明党的表态——在特搜部公布结果的十分钟后，国土交通大臣便召开记者会，冷冰冰地宣布“对此事毫不知情”，并“与自民党保持距离”。短短一句话，切割得干净利落。\n而这，不过是地狱的入口。菅义伟心知，这场大火已经点燃，很快就会吞噬整个自民党。\n偏偏，屋漏偏逢连夜雨。大洋彼岸，美国那边也彻底崩溃——政府关门、股市崩盘、盟约动摇、烈焰升腾。此刻的菅义伟，对那群为党争把世界拖入泥潭的美国政客，几乎生出刻骨的恨意。\n两场风暴叠加，民众的愤怒正席卷而来。民调显示，自民党的支持率跌至历史最低点——惨到若此刻举行选举，连一百个议席都难保。\n菅义伟疲惫地捏了捏眉心，脸色灰败如纸。胜负已无意义，任何形式的“挽救”都成了奢望。距离众议院任期结束，只剩四个月。一个无派系背景的老人，他能做什么？能挡住这场从内部燃起的崩塌吗？\n他在心底，又默默咒骂了一遍安倍与那群只会惹祸的派系头目。\n然后，他缓缓拿起那部红色的保密电话，拨通了党干事长代行的号码。\n“喂，是野田干事长代行吗？我是菅。”\n他的声音平静得近乎冰冷。\n“我决定——三天后，解散众议院。四十天内，举行大选。”"
bangjap.2003.a: "沉默在电话两端蔓延，像是宣告着一个时代的终结"
bangjap.2003.a.tt: "注意请选择人联线以确保正常游玩"

bangjap.2004.t: "丰川丑闻？"
bangjap.2004.d: "宫本彻走在解封不久的东京街头。\n\n说实话，久违的自由空气本应让他感到一阵舒爽，但他的心情却并不怎么开心。原因无他，作为日本共产党的众议院议员，他——以及整个在野党——都未能阻止自民党政府此前推行的大规模封控措施。当然，在那个自公联盟手握众议院三分之二绝对多数的国会里，或许本就没人能阻止他们。一想到这个议席现状本身，宫本的心情就更加绝望了。\n\n正当他沉思着走过一个街角时，旁边的小巷里突然窜出一个黑影，悄无声息地站到了他面前，把他结结实实地吓了一跳。宫本下意识地后退一步，以为是哪个极端右翼分子要来刺杀他。那个身影压得极低的鸭舌帽，和脸上那严实的口罩，更是让他心惊肉跳。\n\n不过，当他定下神来，才发现对面只是一个身材异常娇小的人，身高恐怕还不到一米六。 正当宫本摸不着头脑时，一个清冷的、带着一丝不符合其年龄的沉稳的少女声音传来：“请问，是宫本彻先生吗？”\n\n“……是。” 宫本回答道。他现在彻底懵了，完全不明白为什么会有一个把自己伪装得如此严实的少女，在街头拦住他。他的心里，再次升起了一股强烈的不安。\n\n女孩没有多余的废话，直接从风衣口袋里掏出一个密封完好的厚信封，递了过来。 “这里面，” 她的声音压得很低，“有安倍内阁时期的经产相世耕弘成，与丰川集团相勾结，将整个北海道开发项目打包贱卖给后者的部分罪证。当然，这只是一小部分……”\n\n宫本的大脑几乎是出于本能地，一片空白地接过了那个信封。当他回味着女孩刚才那句话里的每一个词时，他突然浑身一惊，瞬间明白了，为什么这个少女会如此鬼鬼祟祟。\n\n然而，宫本并没有因此放松警惕。他迅速扫了一眼周围，确保没有摄像头正对着这里，然后对着那个正准备转身离开的女孩，低声问道：“对不起……但是，能请问你叫什么名字吗？我保证，绝不会把你的事说出去。”\n\n女孩的脚步顿住了。她沉默了几秒钟，帽檐下的阴影让人看不清她的表情。然后，她用一种近乎耳语的声音回答道： “……祥……瑞穗。我叫，瑞穗。”\n\n宫-本望着那个自称“瑞穗”的女孩迅速远去、最终消失在人群中的背影，心中感到更加奇怪了。但此刻，他也顾不得深究这些了。他紧紧地握着那个沉甸甸的信封，立刻掏出手机，快步走到另一个街角，拨通了电话。 “喂，是我……我现在在……帮我叫辆车，马上去日共本部。”\n\n几天后，《赤旗报》的头版，用赫然醒目的黑体字，刊登了一行足以震动整个永田町的标题： “丰川集团与前经产相世耕弘成，疑似存在重大官商勾结。”"
bangjap.2004.a: "骇人听闻"

bangjap.2005.t: "大厦将倾"
bangjap.2005.d: "坐在外务省那间宽大的办公室里，新上任不久的事务次官森健良，却焦急得如同热锅上的蚂蚁。他的左手毫无规律地敲打着光滑的桌面，右手则时不时地抬起，看一眼腕上的手表，仿佛在等待着某个迟迟未落下的判决。\n\n当然，如今日本国内是何种状况，已是人尽皆知。自《赤旗报》投下那枚重磅炸弹以来，东京地检特搜部与警视厅的联合行动，已经带走了数名丰川集团的高管和自民党的中层官员。事件引发的政治地震，正闹得整个东京乃至全日本都人心惶惶，日经指数的K线图，更是如同断了线的风筝般疯狂下跌。\n\n不过，对于森健良这位职业外交官来说，国内的经济风暴，暂时还没有直接冲击到他。一方面，他已然身居次官之位，轻易不会受到波及；另一方面，他毕竟是个外交官，国内的经济事务，即便他焦头烂-额也无济于事。他能做的，也唯一应该做的，就是管好自己的一亩三分地——外交，或许还能在国际上为这个摇摇欲坠的国家，挽回一丝颜面，争取一点空间。\n\n但大洋彼岸，同样没有传来任何好消息。\n\n自2020年的那场大疫情以来，整个美利坚合众国，就像一架失控的飞机，突然开始了令人不安的下坠。特朗普政府对疫情的应对堪称灾难，由此引发的社会抗议与撕裂，至今未能弥合。当然，若仅仅如此，还不足以让这位在北美局工作了数十年的老官僚如此忧心。但自那场争议巨大的大选之后，事情反而愈发恶化了：街头暴力频发，疫情的死亡人数持续攀升。随后，今年3月份，国会山又爆发了一次大规模的政治暴力事件，直接导致国会陷入半停摆状态——而要命的是，那次国会本应是为了紧急上调债务上限和调整财政支出而召开的。\n\n连锁反应接踵而至。世界各国开始恐慌性地抛售美债。五月，美联储主席鲍威尔在一次记者会上，几乎是绝望地承认：“美国现在恐怕已然无法自救”。自此，美国便彻底陷入了财政崩溃、经济衰退和社会暴力激增的死亡螺旋之中。森健良越来越担心，这个二战后世界的霸主，能否走出这场立国以来最大的危机。\n\n就在这时，桌上那部红色的保密电话刺耳地响了起来。森健良迅速接起电话，当得知对方是北美局局长市川惠一时，他的神色瞬间变得不安起来。在整个通话期间，森的身体开始不受控制地微微颤抖，额头上渗出了细密的冷汗。\n\n挂断电话后，森健良在椅子上僵坐了许久，仿佛用尽了全身的力气，才让自己从刚才的消息中缓过神来。然后，他拿起了另一部电话。\n\n“喂？我是森。请帮我转接茂木大臣。”\n\n当听到电话那头换成了外务大臣茂木敏充的声音后，森健良闭上眼睛，用一种近乎干涩的、不带任何感情的语调，缓缓地开口。\n\n“大臣……我必须向您报告……美国，已经陷入了事实上的分裂。我们……我们再也找不到一个权威、可靠的中央政府了……”"
bangjap.2005.a: "某条时间线好像发生过这事？"

bangjap.2006.t: "旧时代的崩塌"
bangjap.2006.d: "近两天，二叶筑紫心情很差——事实上，恐怕没有哪个日本人的心情能好起来。\n\n自从《赤旗报》刊登那篇爆炸性新闻后，整个日本社会都炸开了锅。国会沦为格斗场，前经济产业相世耕弘成在无数镜头的闪光灯下，被东京地检特搜部的人带走。\n\n这股滔天巨浪也波及了月之森学园。各种真假难辨的“内幕消息”私下流传，人心惶惶。筑紫听说，一些出身自民党议员或财界高管家庭的学生，甚至都不敢来上学了。\n\n筑紫能敏锐地感到，身边的乐队伙伴们——无论是敏感的真白、冷淡的瑠唯，还是平日开朗的透子和七深，脸上都笼罩着一层苦涩。在这种压抑的气氛下，Morfonica的乐队活动事实上已陷入暂停。\n\n今天放学后，乐队没有排练。或许是弥漫的不安激发了筑紫的好奇心，她拉上七深，特意找到了同班同学胜岛聪美。聪美的祖父曾是法务大臣，父亲也是现任议员，筑紫希望能从她那了解到一些内幕。\n\n但一路上，三人的聊天无比生硬。\n\n突然，聪美口袋里的手机响了。看到来电显示，她神色异常紧张。整个通话中，她几乎没说话，只是偶尔用鼻音回应。那份紧张感也传染给了筑紫和七深。\n\n挂断电话后，聪美呆愣片刻，突然转身抱住两人，带着哭腔说：“对不起……我……我应该早就料到并告诉你们的……”\n\n“发生什么事了，胜岛同学？”筑紫小心翼翼地问，心提到了嗓子眼。\n\n聪美抬起头，用一种混合着恐惧与震惊的、颤抖的声音，说出了一段让筑紫大脑瞬间空白的话：\n\n“……世耕弘成……被定罪了。同时……他供出了九十八名自民党国会议员……和二百三十三名……中央省厅的高级官僚……”"
bangjap.2006.a: "崩落前夜"
