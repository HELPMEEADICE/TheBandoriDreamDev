BGD_Tsukushi_DESC: "自二战以来，美国人从未设想过有一天他们的舰队竟会被日本人所掌控。然而，现实却远超想象：Morfonica乐队的队长兼鼓手，娇小的二叶筑紫，赫然成为了如今联邦海军司令部的最高领导人。更令人啼笑皆非的是，这位奇特的总司令，竟被记者们冠以“仓鼠”这样无害的外号，而她本人对此也只能无奈地提出抗议。\n\n对筑紫而言，音乐生涯始于对真白的帮助，这奠定了她热心与认真的底色。她看似可靠却不时流露出的粗心，反而为她增添了几分平易近人的可爱。或许没有那场席卷日本的危机，这位出身优渥的大小姐会一直沉浸在单纯的乐队生活中。然而，命运自有安排。在随后的内战中，筑紫追随香澄，凭借其卓越的协助能力，成功帮助多惠处理了美国在日本遗留的人员与诸多棘手要求。因此，筑紫声名鹊起，并在战后出任对美事务特命担当相，专门负责解决美国的问题，以期在日本“大洗牌”后争取到最有利的国际地位。\n\n紧接着，一个看似不可能却绝妙的转机浮现。联邦海军由于仅余阿拉斯加和太平洋海岛等基地，已无力独自维持其庞大舰队；而日本正亟需强化海上实力。筑紫敏锐地抓住了这一契机，主导签署了《火奴鲁鲁协议》。根据协议，日本正式接管了的美国海军，筑紫也顺理成章地成为了日本对美事务的实际前线指挥官。"
BGD_Mashiro_DESC: "仓田真白，现任美利坚过渡政府特派代表兼最高联络官，人称“史上最不情愿的外交官”。从前她只是Morfonica乐队里那个低调到可以隐形的主唱，原本的人生理想不过是安静地过完每一天，结果却被户山香澄以“我相信你”的名义强行推上了国际舞台。\n\n真白出使美国之前，她最大的外交经验仅限于代表乐队和别的社团协商排练室的使用权。因此，当她被任命时，整个人一脸茫然外加无奈，但又无法抗拒香澄那副热切期待的眼神，于是带着“希望事情不要搞砸”的朴素愿望踏上了美洲大陆。\n\n谁料想，凭借天生诚恳的目光和“紧张到让对方都心软”的谈判风格，她竟意外成为了调停各派势力的关键人物。无数次紧张到快昏厥的会议后，终于艰难撮合出美国的统一方案。如今，她不仅被美国各派领袖戏称为“史上最不具有攻击性的谈判大师”，还创下了美利坚史上唯一一次让所有派系同时感到内疚并妥协的外交奇迹。\n\n虽说职位已高到吓人，但她本人最想做的，还是早点结束任务回家，继续写她那首永远都没写完的歌。"
