#国策###################
USN_ganshe_start: "遥远的来客"
USN_ganshe_start_desc: "我们通过努力，签订了《火奴鲁鲁协定》现在，我们是时候派人去接管这座庞大的军事设施和数量可观的军事资产了，而香澄决定的成员，将会是梦限大的五人，和Morfonica的主唱和鼓手来担任这些要职。"
USN_junshi_yantao: "马卡拉帕军事在编研讨会"
USN_junshi_yantao_desc: "马卡拉帕山，这个曾经的战略高地和军事要塞，如今将以其历史之名，成为我们探讨未来的起点。我们将召开马卡拉帕军事研讨会，邀请各方军事专家和学者，共同审视当前的国际局势，探讨新兴技术带来的挑战与机遇。本次会议旨在总结过去的经验，规划未来的军事发展蓝图，始终保持战略优势和作战能力。"
USN_junshi_yantao_1: "召开军事探讨一阶段"
USN_junshi_yantao_1_desc: "在《火奴鲁鲁协定》的签订下，我们成功取得了对珍珠港这座庞大军事设施及其可观军事资产的接管权。现在，是时候组建一支精英团队来执行这一历史性任务。经香澄决定，将由“梦限大”的五位成员担任核心要职，并由“Morfonica”的主唱和鼓手共同加入，负责关键领域的领导工作，以确保平稳、高效地完成此次军事资产的接收和管理。"
USN_junshi_yantao_2: "召开军事研讨二阶段"
USN_junshi_yantao_2_desc: ""
USN_wast: "西方战场经验"
USN_wast_desc: "依靠正规军与火力优势保持地区秩序与对外威慑。建议建立联合指挥中心，整合海、空、陆三军通信与情报系统，对岛内及周边局势进行全天候监控。军事演习与科技升级并行，强调无人机、卫星侦察与信息化作战，提高打击效率与防护能力。"
USN_east: "东方战场经验"
USN_east_desc: "依赖地缘优势和人口资源，强调战略纵深与整体协调。结合民生政策与军事部署，强调整体协调与长线作战，擅长以持久防御消耗敌方实力，同时通过地理优势进行有限反击。"
USN_middle: "敌后战场经验"
USN_middle_desc: "灵活、快速、非正规手段应对局部冲突。发动群众力量，与地方民众网络结合，建立快速响应系统和地下供应链。强调自主作战与适应环境能力，装备轻便、高机动性武器系统，能在敌方重火力面前保持灵活性。"
USN_Rebuid_Armored_Cavalry_Battalion: "重组装甲骑兵部队"
USN_Rebuid_Armored_Cavalry_Battalion_desc: ""
USN_music_first: "变化的交响乐"
USN_music_first_desc: "“Morfonica”——她们的名字，取自德语“变化”Metamorphose的精髓与代表小提琴的Symphonic的交响乐之优雅，预示着一股新生的力量。如今，经过实地参观的洗礼与紧张的过渡工作，这支充满潜力的队伍已然做好准备。是时候让她们正式走马上任，以其独特的旋律，为联邦海军维和司令部的未来，奏响变革的乐章了。"
USN_Science_Action: "科学化作行动"
USN_Science_Action_desc: "科学化作行动（Science into Action）——这是美国国防高级研究计划局（DARPA）的铿锵格言。该机构以将前沿科学与大胆构想高效转化为军事优势为核心使命，虽未在珍珠港直接部署军事资产，但其研发的尖端科技却成为推动联邦海军维和司令部科技飞速发展的强劲引擎，为未来战场构筑起坚不可摧的力量基石。"
USN_war_Prepare: "平和备生 未雨绸缪"
USN_war_Prepare_desc: "平和备生，未雨绸缪”——备えあれば憂いなし。这句格言完美诠释了前自卫队的本质：因和平而生，却为一切潜在危机而备。如今，这已不再只是口号。是时候让现役国民防卫军，以运输船与飞机作为实践这一格言的资本，用行动来验证它的真谛了。"
USN_Honor_Courage: "荣誉 勇气 奉献"
USN_Honor_Courage_desc: "荣誉、勇气、奉献（Honor, Courage, Commitment）——这三项源自美国海军的核心价值观，如同不灭的灯塔，指引着联邦海军维和司令部官兵的精神信仰与行为准则，铸就其战斗力与使命担当的基石。\n然而，我们同样不能忽视，在“新太约”的旗帜下，一支来自珍珠港本地、同样强大且充满活力的军官团，正蓄势待发。 无论如何，就让我们将这股本土力量融入我们的指挥体系，让他们为联邦海军维护司令部的战争，贡献其独特的智慧与力量了。"
USN_Safety_Trust: "安全信赖第一"
USN_Safety_Trust_desc: "“安全与信赖第一”（安全と信頼を第一に）虽未在日本防卫研究所的官方文件中直接出现，但其核心理念已经深植于该机构的使命和价值观之中。日本防卫研究所长期在前日本自卫队的战略研究和政策制定中发挥着重要作用。尽管美国国防高级研究计划局的资源为我们提供了丰富的科技研发支持，但本土资源依然对我们的发展不可或缺。"
USN_true_feelings: "一起，变强"
USN_true_feelings_desc: "一起，变强！”（共に、強く）。这句听似轻松甚至略显稚拙的格言，却恰恰传递了自卫队军官们面向未来的深刻展望。它常出现在训练与宣传中，强调唯有团队协作与彼此扶持，才能锤炼并提升整体战斗力。面对严峻挑战时，只有全体齐心协力，方能突破险阻。而此刻，正是让本土践行这句来自前日本海上自卫队的格言、伸手拉我们一把的时候了。"
USN_zhanwen_jiaogen: "站稳脚跟"
USN_zhanwen_jiaogen_desc: "伴随着APLA的停止抵抗，我们在美洲的事业获得了立足点。随着大量的美国人参与我们的事业，我们必须重新审视对美洲的进一步方针"
USN_mainland_first: "本土优先"
USN_mainland_first_desc: ""
USN_aid_first: "援助优先"
USN_aid_first_desc: ""
USN_Reconstruct_National_Guard: "重建国民警卫队"
USN_Reconstruct_National_Guard_desc: "在美利坚内战爆发之前，国民警卫队是联邦正规军之外，一支由各州政府直接指挥、拥有丰富战斗经验的强大武装力量。他们是州级别的最后防线，在警察无法控制的危机与联邦军队赶到前的漫长空窗期中，承担着维护治安、救灾和镇暴的核心责任。\n​如今，这支力量因内战而瓦解、腐败或被地方军阀吞并。为了更好地重建、管理与掌控美国这片广袤而古老的土地，我们必须在日本的严格监管之下，重新组建并训练一支忠诚、高效的国民警卫队。\n​这不仅是为了稳定地方秩序，更是为了将美国核心州的大量潜在人力，转化为可控的防卫力量"
USN_Drug_Crackdown: "扫毒行动"
USN_Drug_Crackdown_desc: ""
USN_Reshape_Greatest_Generation: "重塑最伟大的一代"
USN_Reshape_Greatest_Generation_desc: "80年前,当战争的阴影落到美国平民大众上时这道阴影瞬间被我们的民族意识产出的光芒撕扯出了好几道裂痕,无数的学生工人农场主纷纷参军,工业机器全面运转,无数的补给发往了全世界各个反法西斯战争,我们的自由之师在诺曼底在北非,亦或者瓜岛,菲律宾,我们的军舰驰骋大洋,我们的空军翱翔蓝天\n而如今,美国工业停滞，民不聊生，全国的战乱才刚刚停止,我们必须重塑这种精神,将美国再次搬回正轨"
USN_Reinstate_social_labor: "重启社会劳工保障制度"
USN_Reinstate_social_labor_desc: ""
USN_completely_transformed: "焕然一新"
USN_completely_transformed_desc: "我们的经济改革已经获得了当地民众的普遍支持，现在我们得开始着手重启对其他军阀的战争计划以让全美国的人民能够享受到我们改革所带来的福利。为了和平，为了民生！"
USN_Rebuild_Intelligence_Community: "重建美国情报共同体"
USN_Rebuild_Intelligence_Community_desc: "美国情报共同体（U.S. Intelligence Community, IC）由18个机构组成，涵盖中央情报局、国家安全局、联邦调查局等，负责收集、分析和共享国内外情报，为国家安全、反恐、军事行动及政策决策提供支持，在这场毁天灭地的内战之后，为了重建它们，是时候再次编写适合新时代的所谓《情报改革法》了。"
USN_Approve_and_issue: "核准发布总统重大应急声明"
USN_Approve_and_issue_desc: "海军维和司令部领导人二叶筑紫宣布加州进入重大灾难状态，授权联邦临时紧急事务管理局（FEMA）提供援助并总领救灾，以支持州、部落和地方政府的灾后恢复工作。国土安全部、国家响应框架、国家气象局、美国林务局、国家响应框架亦响应声明进入紧急状态。"
USN_Support_Cal_Fire: "支援加州林业与消防局"
USN_Support_Cal_Fire_desc: "加州林业与消防局（Cal Fire） 是加州州政府负责林业管理与火灾防控的核心机构。在灾害应急中，其担任野火扑救主力，协调州内地方消防部门和志愿消防队伍，组织地面和空中灭火行动。机构还负责居民疏散与安全指引，但在内战中，他们士气受挫，物资紧缺。如今，随着洛杉矶港的重建，日本本土运输船和运输机的到来，无疑将为他们提供新的动力和资源支持。"
USN_ensure_logistic_support: "保障后勤支持"
USN_ensure_logistic_support_desc: "在加州野火扑救行动中，后勤保障发挥着至关核心的作用。它涵盖物资供应、燃料运输、机械设备维修、消防人员食宿与医疗保障、通讯协调，以及空中与地面支援的高效调度，确保每一支消防队伍和大型灭火设备都能持续、稳健地运作。在火场上，后勤不仅是保障行动顺利的支撑，更是控制火势、保护居民生命财产安全的关键枢纽。而我们肩负的使命，正是守护这条贯穿火线的“防火生命线”，让前线的战士们无后顾之忧，能够全力投入灭火与救援，直至火场安全可控。"
USN_Ensure_smooth_information: "保障信息通畅与公共关系"
USN_Ensure_smooth_information_desc: "在加州大火扑救中，保障信息通畅与公共关系发挥着至关重要的作用。通过及时发布火情通报、撤离指令和安全提示，控制谣言、缓解恐慌，协调媒体报道与公众互动，增强信任感和合作意愿。信息畅通不仅支持前线消防队伍高效作战，也为居民生命财产安全提供坚实保障，是整个救灾体系中不可或缺的精神与行动支撑，所以，我们更需要做出一系列措施，从而维护我们和群众的关系。"
USN_return_to_normal: "回归常态"
USN_return_to_normal_desc: "在这一刻，我想对每一个参与救援的人说一声“谢谢”，对每一个受灾的家庭说一声“我们与你们同在”。今天，我们不仅庆祝火灾的扑灭，也庆祝社区的团结、勇气和互助精神。\n这些火灾提醒我们，气候变化的威胁是真实而紧迫的。极端天气正在改变我们的生活方式，也对我们的社区和基础设施提出挑战。但美国人民从不退缩，我们团结一心、互相扶持，共同面对困难，这就是我们的力量所在。\n加州的重建只是开始，但我相信，只要我们携手并肩，美国的每一个社区都能变得更安全、更坚强。让我们一起努力，为今天，也为未来。——仓田真白于洛杉矶临时安置点的演讲"
USN_March_Before_the_Dawn: "疾行于黎明之前"
USN_March_Before_the_Dawn_desc: "长夜漫漫，每一刻的等待都意味着更多生命的凋零。稳健的重建固然美好，但对于深陷战乱的人们来说，太过遥远。\n因此，我们选择了一条更迅捷、也更艰险的道路。\n我们将以雷霆之势，迅速终结这场吞噬大陆的战争。这不是为了征服，而是为了以最短的痛苦，去换取长久的和平。我们将成为那支追赶太阳的先锋，用决然的进军，为这片土地强行拉开黎明的序幕。\n诚然，疾行之路充满风险，后方将空虚，补给将紧绷。但为了让和平的曙光能早一刻到来，我们甘愿背负这一切。\n这是我们的觉悟，一场为了和平的竞速——疾行于黎明之前。"
USN_Dawnlight_Supply_Line: "黎明补给线"
USN_Dawnlight_Supply_Line_desc: "追光者自身，亦需光芒。\n我们的先锋部队正在大陆深处疾行，传统的补给线已不堪重负。为了支撑这场与时间的赛跑，我们必须建立一个更高效、更立体的生命线。\n‘黎明补给线’将强化地面快速运输，并辅以关键物资的夜间精准空投。车队与机群协同，如同两条坚韧的动脉，确保在每个黎明到来之前，为前线注入继续前行的力量。这是一个由勇气、汗水和精确计算构筑的补给网络，是我们赢得这场竞速的关键所在。"
USN_Coordinated_Symphony: "协同交响曲"
USN_Coordinated_Symphony_desc: "战场并非杂乱的噪音，而应是一首精准的交响乐。\n‘协同交响曲’计划将打破陆军与空军的壁垒，建立一套全新的实时数据链。坦克将为空中打击指示目标，战机将为地面突击清除障碍。\n通过这套系统，我们的海陆空力量将不再是孤立的演奏者，而是一个配合无间的交响乐团。在统一的指挥下，我们将共同奏响一曲由火力与机动谱写的、无可匹敌的胜利乐章。"
USN_Overture_upon_Ruins: "于废墟之上奏响序曲"
USN_Overture_upon_Ruins_desc: "武力可以带来臣服，却带不来和平。真正的统一，源于人心的向往。\n因此，我们选择暂缓东进的步伐，将全部心力倾注于加利福尼亚。我们要在这片废墟之上，奏响一首名为‘希望’的序曲——用繁荣的经济、自由的文化和公平的社会，向整个大陆展示一个值得拥抱的未来。\n这首序曲将通过电波与商路传遍四方，成为我们兵不血刃的武器。当人们在绝望中听到这希望的旋律，仇恨的坚冰自会消融。\n这不是等待，而是一场以人心为战场的更高明的战争。"
USN_The_Final_Peace: "§Y最后的和平通告§!"
USN_The_Final_Peace_desc: "兵临城下，胜负已分。\n我们军事行动的最终目的不是毁灭，而是和平。在最后的炮火奏响之前，我们将向华盛顿发出这份庄严的和平通告，给予对方一个体面结束战争、避免城市化为焦土的机会。\n这不是威胁，而是我们对和平最后的邀请。\n如果他们选择握住这只手，黎明将即刻到来；如果他们拒绝，我们将用雷霆扫清最后的黑暗。无论如何，这场战争都将在我们的意志下终结。"
USN_Trans_Pacific_Harmony: "跨太平洋的和谐音程"
USN_Trans_Pacific_Harmony_desc: "贸易是连接人心的最美和声。\n我们将邀请新加州加入联盟的共同市场，拆除跨太平洋的所有贸易壁垒。联盟的资本与技术将注入加州，而加州的资源与创造力也将滋养联盟。\n这条全新的黄金航道，不仅将带来共同的繁荣，更会将两岸的命运紧密相连。它将成为我们和平序曲中最稳定、最和谐的低音，让任何分裂的企图都失去根基。"
USN_Verse_for_Tomorrow: "明日的诗篇"
USN_Verse_for_Tomorrow_desc: "战争在心中种下的仇恨，远比在土地上留下的废墟更难清除。为了永久的和平，我们必须为下一代谱写新的诗篇。\n‘明日的诗篇’教育法案将以理解取代对立，用艺术疗愈创伤。我们将教导孩子们反思战争的悲剧，欣赏多元的文化，并鼓励他们勇敢追寻自己的梦想。\n我们无法改变昨日，但我们可以为孩子们书写一个截然不同的明天。这是我们在这片土地上，最重要、也最长远的投资。"
USN_The_Butterfly_Web: "蝴蝶之网"
USN_The_Butterfly_Web_desc: "在高墙之后，同样有渴望和平的眼睛。\n‘蝴蝶之网’计划将编织一张覆盖大陆的无形网络。我们不输送武器，只传递信息、善意与希望。我们的特工将是文化信使和人道协调员，通过音乐、物资和秘密接触，去唤醒并联结那些同样厌倦战争的人们。\n这张网不发动攻击，却能从内部瓦解敌人的意志。当千万只蝴蝶同时振翅，一场足以颠覆强权的‘蝴蝶效应’便将发生。"