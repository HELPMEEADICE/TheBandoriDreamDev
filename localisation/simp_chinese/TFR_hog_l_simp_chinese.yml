 JAP_hog_shinzo_abe: "首相：§H安倍晋三§!\n\n\n\n\n\n\n\n   £GFX_JAP_shinzo_abe_por\n\n\n\n\n\n\n\n\n-------------------------------------\n§L安倍晋三于1954年，降生于一个在日本近代史上举足轻重的政治世家。翻开他的家谱，一连串显赫的名字熠熠生辉——祖父安倍宽、外祖父岸信介、叔外祖父佐藤荣作，以及他的父亲安倍晋太郎。或许，正是这样的出身，注定了他绝不会是一个平凡之人，即便是在他那些同样出身不凡的“政二代”同侪之中。\n从成蹊大学毕业后，安倍短暂地进入神户制钢所工作，先是在纽约分公司的出口部，后又转入加古川制铁所的工程部。不久，他便辞去商界职务，正式踏入政界，担任时任外务大臣的父亲——安倍晋太郎的秘书官，直至其父卸任。在此期间，他与森永制果集团的大小姐松崎昭惠结为连理。1991年，随着父亲晋太郎的去世，安倍正式决定接过其政治衣钵，并在1993年的众议院选举中成功当选，开启了自己的国会议员生涯。\n随后，安倍的仕途开始稳步上升。2000年，他在森喜朗内阁中出任内阁官房副长官，并因在小泉纯一郎首相历史性的访朝会谈中，以对朝强硬姿态频频露面而声名鹊起。2003年，他被擢升为自民党干事长，并以废除党内常态化的“年糕津贴”和“冰津贴”等福利，展现了其改革派的一面。2005年，他出任小泉内阁的内阁官房长官，并在任上首次提出了“美丽日本”的政治构想。 终于，在2006年，他第一次成功拜相，成为日本战后最年轻的首相。然而，彼时的他尚缺乏经验，任上阁僚丑闻不断，甚至发生了农林水产大臣松冈利胜自杀的恶性事件。在2007年参议院选举惨败后不久，他便因健康原因，仓促辞职下野。\n然而，历史给了他第二次机会。2012年，他奇迹般地再度当选为自民党总裁，并于同年底的众议院选举中，率领自公联盟以压倒性优势大败民主党，夺回了政权。次年，他又赢下了参议院选举，彻底终结了“扭曲国会”的局面。从此，一个长达近八年、伴随着巨大争议与显著成就的“安倍时代”，正式开启了。 从强行通过《特定秘密保护法》到推动备受争议的“新安保法制”；从推出“安倍经济学”三支箭到两次上调消费税；从积极奔走、最终促成CPTPP谈判，到深陷森友、加计学园等一系列政治丑闻……这位强人首相始终充满争议，却总能在一次次的国政选举中大获全胜，并持续不断地推进着他那带有浓厚保守色彩的政治议程。\n只不过，随着时光流逝，他毕生追求的“修改宪法第九条”这一宏愿，似乎正变得越来越遥远。东京奥运会召开在即，而他作为自民党总裁的第三个任期，也即将迎来终点。这位战后可以留下名字一笔的传奇人物，究竟为日本带来了希望，还是留下了一个更大的骗局？历史的天平，恐怕早晚要给出分晓。§!"
 JAP_hog_yoshihide_suga: "首相：§H菅义伟§!\n\n\n\n\n\n\n\n   £GFX_JAP_yoshihide_suga_por\n\n\n\n\n\n\n\n\n-------------------------------------\n§L1948年，菅义伟出生于秋田县的一个草莓种植农家。他的父亲是当地“秋之宫村”草莓生产合作社的社长，这在当地也算是个小有名望的“头面人物”了。但对于菅义伟日后将要踏上的那条通往权力顶峰的道路而言，这个出身，显然太过“寒酸”了。\n高中毕业后，他怀揣着改变命运的渴望来到东京，在板桥区的一家纸箱厂里找到了一份工作。但工厂的流水线并非他的终点。不久后他便辞职，在经历了两年一边打工一边备考的艰苦生活后，他成功考入了法政大学法学部。\n1975年，菅义伟从大学毕业。经校友辗转介绍，他得到了一个宝贵的机会——担任众议院议员小此木彦三郎的秘书，从此正式踏入了政治的门槛。在此期间，他结识了自己政治生涯中的第一位重要恩人——神奈川县议员梅泽健治。1986年，他辞去了长达十一年的秘书职务，并在次年的横滨市议员选举中成功当选，开启了自己的政治家生涯。在担任市议员期间，他不仅两度连任,还曾担任彦三郎之子八郎的选举事务长。同时，由于他出色的协调能力和对市政的深刻影响力，他被当地政界誉为横滨的“影子市长”。\n1996年，他首次当选为众议院议员，正式开始了其在国政舞台上的生涯。在小泉内阁时期，他曾在竹中平藏担任总务大臣时，出任其副手。而在之后的第一次安倍内阁中，他被任命为总务大臣，也由此开始与安倍晋三在政坛的核心紧密共事。在此期间，他最著名的一件事，便是在2007年那场沸沸扬扬的“年金记录问题”中，绕开当时的厚生劳动大臣柳泽伯夫，独自展开调查，并单方面地向媒体宣布了日本邮政社长生田正治的辞职，展现了其果断甚至有些冷酷的行事风格。在第一次安倍内阁因参议院选举惨败而倒台后，菅义伟转而担任自民党的选举对策副委员长。在任上，出身平民的他曾试图推动一项旨在限制议员世袭的党内改革，但最终未能成功。\n在2012年自民党重夺政权后，菅义伟被任命为内阁官房长官。他以惊人的耐力，在这个被称为“首相官邸大管家”的职位上，创下了历代在任时间最长的记录。在此期间，他主导了两件对日本政治影响深远的大事——一是策划成立了备受争议的内阁人事局，将高级官僚的任免权集中到了官邸手中；二是在2019年，作为“令和大叔”亲手发布了新年号“令和”。\n然而，随着新冠疫情的恶化和东京奥运会的被迫延期，安倍晋三最终以健康为由突然宣布辞职。在这场突如其来的权力真空中，菅义伟——这位长期以来以其无派阀背景、低调务实形象示人的“苦劳人”——被党内各派系高票推举为新任总裁，并顺利成为了日本第99任内阁总理大臣。然而，在那场看似风光的就职典礼上，恐怕他的内心毫无激动之情，只有对那位将烂摊子甩给自己的昔日“盟友”安倍的复杂不满，以及对于如何处理疫情、奥运和摇摇欲坠的经济等一系列难题的、深不见底的焦虑。§!"
